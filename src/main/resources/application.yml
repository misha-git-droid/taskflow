application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:8ka3fN/o85ozi3A6kmGw56C+O16Safn0t8UsqI4CefU}
      expiration: 86400000  # 24 часа в миллисекундах

spring:
  application:
    name: taskflow

  datasource:
    url: jdbc:postgresql://localhost:5432/taskflow
    username: taskflow
    password: taskflow
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  logging:
    level:
      org.hibernate.SQL: debug
      org.flywaydb: debug
      org.springframework.boot.autoconfigure.flyway: debug
